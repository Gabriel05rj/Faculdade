<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../src/output.css">
<script src="./scripts.js" defer></script>

  <title>Entrar | Elo-Sangue</title>

  <link rel="stylesheet" href="../src/output.css">
  <script src="./script.js" defer></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-[#c3b5ac] p-4 font-sans text-black">

  <main class="w-full max-w-[600px] bg-[#f9ece4] px-6 pb-6 pt-4 sm:px-11">

    <!-- Nome da plataforma -->
    <h1 class="text-center text-2xl font-semibold">
      <a href="../index.html">
        Elo-<span class="text-red-600">Sangue</span>
      </a>
    </h1>

    <div class="mx-auto mt-3 max-w-[402px]">

      <h2 class="text-3xl font-bold leading-tight sm:text-[32px]">
        Entre na sua conta
      </h2>

      <p class="mt-1 text-sm text-stone-500">
        Bem-vindo de volta! Continue fazendo a diferença.
      </p>

      <form id="form-login" class="mt-8">

        <!-- E-mail -->
        <label for="email" class="sr-only">
          E-mail
        </label>

        <div class="flex items-center gap-4 rounded-md border border-stone-400 bg-white px-5 focus-within:border-red-600 focus-within:ring-2 focus-within:ring-red-100">

          <svg
            class="h-4 w-4 shrink-0 text-gray-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 6 9 7 9-7"/>
          </svg>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="seuemail@exemplo.com"
            autocomplete="email"
            required
            class="min-w-0 flex-1 bg-transparent py-2.5 text-sm outline-none placeholder:text-stone-600"
          >
        </div>

        <!-- Senha -->
        <label for="senha" class="sr-only">
          Senha
        </label>

        <div class="mt-8 flex items-center gap-4 rounded-md border border-stone-400 bg-white px-5 focus-within:border-red-600 focus-within:ring-2 focus-within:ring-red-100">

          <svg
            class="h-4 w-4 shrink-0 text-gray-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <rect x="6" y="10" width="12" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>

          <input
            id="senha"
            name="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
            class="min-w-0 flex-1 bg-transparent py-2.5 text-sm outline-none placeholder:text-stone-600"
          >

          <button
            id="botao-senha"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
            class="cursor-pointer rounded p-1 text-gray-500 hover:text-red-600 focus-visible:outline-2 focus-visible:outline-red-600"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path id="risco-olho" d="m3 3 18 18"/>
            </svg>
          </button>
        </div>

        <!-- Recuperação -->
        <div class="mt-2 text-right">
          <a
            href="./recuperar-senha.html"
            class="text-xs font-medium text-red-600 hover:underline"
          >
            Esqueceu sua senha?
          </a>
        </div>

        <!-- Entrar -->
        <button
          type="submit"
          class="mt-3 flex w-full cursor-pointer items-center justify-center gap-2 rounded-md bg-[#c90d12] py-2 text-sm font-bold text-white transition-colors hover:bg-red-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700"
        >
          Entrar
          <span aria-hidden="true">→</span>
        </button>

        <p
          id="mensagem"
          role="status"
          class="mt-3 text-center text-sm text-stone-600 empty:hidden"
        ></p>

      </form>

      <!-- Cadastro -->
      <p class="mt-6 text-center text-sm text-stone-800">
        Ainda não tem conta?
        <a
          href="../Cadastro/index.html"
          class="ml-1 font-medium text-red-600 hover:underline"
        >
          Cadastre-se
        </a>
      </p>

    </div>
  </main>

</body>
</html>
