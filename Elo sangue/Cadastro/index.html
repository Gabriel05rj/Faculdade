<!DOCTYPE html>
<html lang="pt-br">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../src/output.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Cadastro Elo sangue</title>
</head>
<body class="min-h-screen flex bg-[#ffeade] items-center justify-center p-4">
    
    <main class="w-full max-w-2xl rounded-2xl bg-white p-8 shadow-x1">
        <h1 class="text-3xl font-bold text-center text-red-500 tracking-wide mb-2">Elo-Sangue</h1>

        <h2 class="text-center text-3xl font-bold text-slate-800">Criar conta</h2>
        <p class="mt-2 text-center text-sm text-slate-500">Preenchar seus dados abaixo para criar sua conta</p>

        <!--formulario-->
        <form id="FormCadastro"  class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-3" novalidate>
            <!--Nome-->
            <div class="flex flex-col gap-1">
                <label for="nome" class="text-sm font-semibold text-slate-700">Nome</label>
                <div class="relative flex items-center">
                    <input type="text" id="nome" placeholder="Digite seu nome" 
                        class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100">
                </div>
                <span id="erroNome" class="hidden text-xs text-red-500"></span>
            </div>

            <!-- Sobrenome -->
            <div class="flex flex-col gap-1 justify-end"> <!-- O justify-end alinha o input perfeitamente com o do lado -->
                <div class="relative flex items-center">
                    <input type="text" id="sobrenome" placeholder="Digite seu sobrenome" 
                        class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-sm focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100">
                </div>
                <span id="erroSobrenome" class="hidden text-xs text-red-500"></span>
            </div>

            <!--Email-->
            <div class="flex flex-col gap-1 md:col-span-2">
                <label for="email" class="text-sm font-semibold text-slate-700">E-mail</label>
                <div class="relative flex items-center ">
                    <input type="email" id="email" placeholder="seuemailex@gmail.com" 
                    class=" w-full rounded-lg border border-slate-300 px-4 py-2 text-sm focus:border-red-800 focus:outline-none focus:ring-2 focus:ring-blue-100">
                </div>
                <span id="erroEmail" class="hidden text-xs text-red-500"></span>
            </div>

            <!--Telefone-->
            <div class="flex flex-col gap-1 md:col-span-2 ">
                <label for="telefone" class="text-sm font-semibold text-slate-700">Telefone</label>
                <div class="relative flex items-center">
                    <input type="text" id="telefone" placeholder="(00)00000-0000" 
                        class="w-full rounded-lg border border-slate-300 px-4 py-2 text-sm focus:border-red-800 focus:outline-none focus:ring-2 focus:ring-blue-100">
                </div>
                <span id="erroTelefone" class="hidden text-xs text-red-500"></span>
            </div>

            <!--Senha-->
            <div class="w-full relative flex flex-col gap-1">
                <div class="relative flex items-center">
                     <input type="password" id="campoSenha" placeholder="No mínimo 6 caracteres" 
                         class="w-full rounded-lg border border-slate-300 pl-4 pr-10 py-2.5 text-sm focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100">
                     <button type="button" id="btnOlho" class="absolute right-3 text-lg cursor-pointer select-none opacity-60 hover:opacity-100">
                         👁️ 
                     </button>
                </div>

                <span id="erroSenha" class="hidden text-xs text-red-500"></span>
            </div>

            <!--COnfirmar senha (precisar ver como fazer)-->
            <div class="w-full relative flex flex-col gap-1">
                <div class="relative flex items-center">
                     <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" 
                         class="w-full rounded-lg border border-slate-300 pl-4 pr-10 py-2.5 text-sm focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100">
                      <button type="button" id="btnOlhoConfirmar" class="absolute right-3 text-lg cursor-pointer select-none opacity-60 hover:opacity-100">
                         👁️ 
                     </button>
                </div>
                
                <span id="erroConfirmarSenha" class="hidden text-xs text-red-500"></span>
            </div>


            <!--Enviar-->
            <button type="submit" class="mt-4 md:col-span-2 w-full rounded-lg bg-red-600 py-3 text-sm font-bold text-white transition-all hover:bg-red-900 active:scale-[0.98]">
                Cadastrar
            </button>

            <p class="md:col-span-2 text-center text-sm text-slate-600 mt-2">
                Já tem uma conta? <a href="#" class="text-red-600 font-bold hover:underline">Entrar</a>
            </p>

        </form>
    </main>
</body>
</html>
